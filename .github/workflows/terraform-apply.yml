name: Terraform Apply - Dev

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-dev-apply
  cancel-in-progress: false

jobs:
  terraform-apply:
    name: Terraform Apply - Dev

    runs-on: ubuntu-latest

    environment:
      name: dev

    defaults:
      run:
        working-directory: environments/dev

    steps:

      # ---------------------------------------------
      # Checkout repository
      # ---------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect GitHub OIDC claims
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository: ${{ github.repository }}"
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Ref name: ${{ github.ref_name }}"

          RESPONSE="$(curl -sS \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"

          TOKEN="$(echo "$RESPONSE" | jq -r '.value')"

          PAYLOAD="$(echo "$TOKEN" | cut -d '.' -f2)"

          PAYLOAD="${PAYLOAD//-/+}"
          PAYLOAD="${PAYLOAD//_/\/}"

          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac

          echo "$PAYLOAD" | base64 --decode | jq .

      - name: Inspect GitHub OIDC claims
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository: ${{ github.repository }}"
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Ref name: ${{ github.ref_name }}"

          RESPONSE="$(curl -sS \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"

          TOKEN="$(echo "$RESPONSE" | jq -r '.value')"

          PAYLOAD="$(echo "$TOKEN" | cut -d '.' -f2)"

          PAYLOAD="${PAYLOAD//-/+}"
          PAYLOAD="${PAYLOAD//_/\/}"

          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac

          echo "$PAYLOAD" | base64 --decode | jq .


      # ---------------------------------------------
      # Configure AWS using GitHub OIDC
      # ---------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::438064565553:role/GitHubActions-Terraform-Dev-Apply
          aws-region: ap-south-2


      # ---------------------------------------------
      # Verify AWS identity
      # ---------------------------------------------

      - name: Verify AWS identity
        run: aws sts get-caller-identity


      # ---------------------------------------------
      # Setup Terraform
      # ---------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # ---------------------------------------------
      # Terraform Init
      # ---------------------------------------------

      - name: Terraform Init
        run: terraform init -input=false


      # ---------------------------------------------
      # Terraform Validate
      # ---------------------------------------------

      - name: Terraform Validate
        run: terraform validate


      # ---------------------------------------------
      # Terraform Plan
      #
      # Generate a fresh plan from main.
      # We intentionally do NOT reuse the plan
      # generated on the feature branch.
      # ---------------------------------------------

      - name: Terraform Plan
        run: |
          terraform plan \
            -input=false \
            -out=tfplan


      # ---------------------------------------------
      # Terraform Apply
      # ---------------------------------------------

      - name: Terraform Apply
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan
