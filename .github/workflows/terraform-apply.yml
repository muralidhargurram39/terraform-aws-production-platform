name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      confirm_apply:
        description: "Type APPLY to confirm Terraform deployment"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: "ap-south-2"
  AWS_ROLE_TO_ASSUME: "arn:aws:iam::438064565553:role/GitHubActions-Terraform-CI"

jobs:
  terraform-apply:
    name: Terraform Apply - DEV

    runs-on: ubuntu-latest

    environment:
      name: dev

    defaults:
      run:
        shell: bash

    steps:

      # ==========================================================
      # Safety Confirmation
      # ==========================================================

      - name: Verify deployment confirmation
        run: |
          set -euo pipefail

          if [ "${{ inputs.confirm_apply }}" != "APPLY" ]; then
            echo "ERROR: Deployment not confirmed."
            echo "Type APPLY exactly when starting the workflow."
            exit 1
          fi

          echo "Deployment confirmation accepted."

      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # Read Terraform Version
      # ==========================================================

      - name: Read Terraform version
        id: terraform-version
        run: |
          set -euo pipefail

          test -f .terraform-version

          TERRAFORM_VERSION="$(tr -d '[:space:]' < .terraform-version)"

          if [[ ! "${TERRAFORM_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid Terraform version: ${TERRAFORM_VERSION}"
            exit 1
          fi

          echo "Terraform version: ${TERRAFORM_VERSION}"

          echo "terraform_version=${TERRAFORM_VERSION}" >> "${GITHUB_OUTPUT}"

      # ==========================================================
      # Setup Terraform
      # ==========================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.terraform-version.outputs.terraform_version }}
          terraform_wrapper: false

      - name: Verify Terraform version
        run: |
          set -euo pipefail

          terraform version

      # ==========================================================
      # AWS Authentication
      # ==========================================================

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "AWS CALLER IDENTITY"
          echo "=========================================="

          aws sts get-caller-identity

      # ==========================================================
      # Terraform Init
      # ==========================================================

      - name: Terraform Init
        working-directory: environments/dev
        run: |
          set -euo pipefail

          terraform init -input=false

      # ==========================================================
      # Terraform Apply
      # ==========================================================

      - name: Terraform Apply
        working-directory: environments/dev
        run: |
          set -euo pipefail

          terraform apply \
            -input=false \
            -auto-approve

      # ==========================================================
      # Deployment Summary
      # ==========================================================

      - name: Deployment summary
        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo "TERRAFORM APPLY COMPLETED SUCCESSFULLY"
          echo "=========================================="

          echo "Environment       : DEV"
          echo "Terraform version : ${{ steps.terraform-version.outputs.terraform_version }}"
          echo "AWS region        : ${{ env.AWS_REGION }}"
          echo "AWS authentication: GitHub OIDC"
          echo "Confirmation      : VERIFIED"
          echo "Terraform init    : PASSED"
          echo "Terraform apply   : PASSED"
