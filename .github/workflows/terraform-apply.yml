name: Terraform Apply

on:
  workflow_run:
    workflows:
      - Terraform CI
    types:
      - completed

  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type APPLY to confirm Terraform deployment"
        required: true
        type: string

      plan_run_id:
        description: "Terraform CI run ID containing terraform-dev-plan"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: "ap-south-2"

jobs:
  terraform-apply:
    name: Terraform Apply - DEV

    if: |
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.confirmation == 'APPLY'
      )

    runs-on: ubuntu-latest

    environment:
      name: dev

    defaults:
      run:
        shell: bash

    steps:

      # ==========================================================
      # Deployment Information
      # ==========================================================

      - name: Display deployment information
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "TERRAFORM DEV DEPLOYMENT"
          echo "=========================================="

          echo "Trigger event: ${{ github.event_name }}"

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "Deployment mode: Automatic"
            echo "Source branch: ${{ github.event.workflow_run.head_branch }}"
            echo "Source run ID: ${{ github.event.workflow_run.id }}"
            echo "Source SHA: ${{ github.event.workflow_run.head_sha }}"
          else
            echo "Deployment mode: Manual"
            echo "Terraform CI run ID: ${{ inputs.plan_run_id }}"
          fi

      # ==========================================================
      # Checkout Exact Source Commit
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      # ==========================================================
      # Read Terraform Version
      # ==========================================================

      - name: Read Terraform version
        id: terraform-version
        run: |
          set -euo pipefail

          test -f .terraform-version

          TERRAFORM_VERSION="$(tr -d '[:space:]' < .terraform-version)"

          if [[ ! "${TERRAFORM_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid Terraform version: ${TERRAFORM_VERSION}"
            exit 1
          fi

          echo "Terraform version: ${TERRAFORM_VERSION}"

          echo "terraform_version=${TERRAFORM_VERSION}" >> "$GITHUB_OUTPUT"

      # ==========================================================
      # Setup Terraform
      # ==========================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.terraform-version.outputs.terraform_version }}
          terraform_wrapper: false

      - name: Verify Terraform version
        run: |
          set -euo pipefail

          terraform version

      # ==========================================================
      # Resolve Terraform CI Run ID
      # ==========================================================

      - name: Resolve Terraform plan run ID
        id: plan-run
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            PLAN_RUN_ID="${{ github.event.workflow_run.id }}"
          else
            PLAN_RUN_ID="${{ inputs.plan_run_id }}"
          fi

          echo "plan_run_id=${PLAN_RUN_ID}" >> "$GITHUB_OUTPUT"

          echo "Terraform plan workflow run ID: ${PLAN_RUN_ID}"

      # ==========================================================
      # Download Exact Terraform Plan
      # ==========================================================

      - name: Download Terraform plan artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-dev-plan
          path: environments/dev
          run-id: ${{ steps.plan-run.outputs.plan_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================================
      # Verify Downloaded Plan
      # ==========================================================

      - name: Verify Terraform plan artifact
        working-directory: environments/dev
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFYING TERRAFORM PLAN"
          echo "=========================================="

          test -f tfplan

          ls -lh tfplan

          file tfplan

      # ==========================================================
      # AWS Authentication using GitHub OIDC
      # ==========================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::438064565553:role/GitHubActions-Terraform-Dev-Apply
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "AWS CALLER IDENTITY"
          echo "=========================================="

          aws sts get-caller-identity

      # ==========================================================
      # Terraform Init
      # ==========================================================

      - name: Terraform Init
        working-directory: environments/dev
        run: |
          set -euo pipefail

          terraform init -input=false

      # ==========================================================
      # Display Downloaded Plan
      # ==========================================================

      - name: Display Terraform plan
        working-directory: environments/dev
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DOWNLOADED TERRAFORM PLAN"
          echo "=========================================="

          terraform show \
            -no-color \
            tfplan

      # ==========================================================
      # Apply Exact Plan
      # ==========================================================

      - name: Terraform Apply
        working-directory: environments/dev
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "APPLYING DOWNLOADED TERRAFORM PLAN"
          echo "=========================================="

          terraform apply \
            -input=false \
            tfplan

      # ==========================================================
      # Deployment Summary
      # ==========================================================

      - name: Deployment summary
        run: |
          set -euo pipefail

          {
            echo "# Terraform DEV Deployment Completed"
            echo ""
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Environment | DEV |"
            echo "| Terraform version | ${{ steps.terraform-version.outputs.terraform_version }} |"
            echo "| AWS region | ${{ env.AWS_REGION }} |"
            echo "| Authentication | GitHub OIDC |"
            echo "| Plan source run | ${{ steps.plan-run.outputs.plan_run_id }} |"
            echo "| Terraform init | PASSED |"
            echo "| Terraform apply | PASSED |"
          } >> "${GITHUB_STEP_SUMMARY}"
