name: Terraform Apply

on:
  workflow_run:
    workflows:
      - Terraform CI
    types:
      - completed

  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type APPLY to confirm Terraform deployment"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: "ap-south-2"

jobs:
  terraform-apply:
    name: Terraform Apply - DEV

    # ==========================================================
    # AUTOMATIC DEPLOYMENT CONDITIONS
    # ==========================================================
    #
    # workflow_run:
    #   - Terraform CI must succeed
    #   - CI must have run against main
    #
    # workflow_dispatch:
    #   - Allows controlled manual deployment
    #
    if: |
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.confirmation == 'APPLY'
      )

    runs-on: ubuntu-latest

    # ==========================================================
    # GitHub Environment Protection
    # ==========================================================

    environment:
      name: dev

    defaults:
      run:
        shell: bash

    steps:

      # ==========================================================
      # Deployment information
      # ==========================================================

      - name: Display deployment information
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "TERRAFORM DEV DEPLOYMENT"
          echo "=========================================="

          echo "Trigger event: ${{ github.event_name }}"

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "Deployment mode: Automatic after successful Terraform CI"
            echo "Source branch : ${{ github.event.workflow_run.head_branch }}"
            echo "Source run ID : ${{ github.event.workflow_run.id }}"
            echo "Source SHA    : ${{ github.event.workflow_run.head_sha }}"
          else
            echo "Deployment mode: Manual"
          fi

      # ==========================================================
      # Checkout repository
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      # ==========================================================
      # Read Terraform version
      # ==========================================================

      - name: Read Terraform version
        id: terraform-version
        run: |
          set -euo pipefail

          test -f .terraform-version

          TERRAFORM_VERSION="$(tr -d '[:space:]' < .terraform-version)"

          if [[ ! "${TERRAFORM_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid Terraform version: ${TERRAFORM_VERSION}"
            exit 1
          fi

          echo "Terraform version: ${TERRAFORM_VERSION}"

          echo "terraform_version=${TERRAFORM_VERSION}" >> "${GITHUB_OUTPUT}"

      # ==========================================================
      # Setup Terraform
      # ==========================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.terraform-version.outputs.terraform_version }}
          terraform_wrapper: false

      - name: Verify Terraform version
        run: |
          set -euo pipefail

          terraform version

      # ==========================================================
      # AWS Authentication using GitHub OIDC
      # ==========================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::438064565553:role/GitHubActions-Terraform-Dev-Apply
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "AWS CALLER IDENTITY"
          echo "=========================================="

          aws sts get-caller-identity

      # ==========================================================
      # Terraform Init
      # ==========================================================

      - name: Terraform Init
        working-directory: environments/dev
        run: |
          set -euo pipefail

          terraform init -input=false

      # ==========================================================
      # Generate fresh Terraform plan
      # ==========================================================

      - name: Terraform Plan
        working-directory: environments/dev
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "GENERATING TERRAFORM PLAN"
          echo "=========================================="

          terraform plan \
            -input=false \
            -out=tfplan

      # ==========================================================
      # Display deployment plan
      # ==========================================================

      - name: Display Terraform plan
        working-directory: environments/dev
        run: |
          set -euo pipefail

          terraform show \
            -no-color \
            tfplan

      # ==========================================================
      # Terraform Apply
      # ==========================================================

      - name: Terraform Apply
        working-directory: environments/dev
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "APPLYING TERRAFORM PLAN"
          echo "=========================================="

          terraform apply \
            -input=false \
            tfplan

      # ==========================================================
      # Deployment Summary
      # ==========================================================

      - name: Deployment summary
        run: |
          set -euo pipefail

          echo "==========================================" >> "${GITHUB_STEP_SUMMARY}"
          echo "# Terraform DEV Deployment Completed" >> "${GITHUB_STEP_SUMMARY}"
          echo "==========================================" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Environment:** DEV" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Terraform version:** ${{ steps.terraform-version.outputs.terraform_version }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **AWS region:** ${{ env.AWS_REGION }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **AWS authentication:** GitHub OIDC" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Terraform init:** PASSED" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Terraform plan:** PASSED" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Terraform apply:** PASSED" >> "${GITHUB_STEP_SUMMARY}"
