name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "GitHub Actions run ID containing the approved Terraform plan artifact"
        required: true
        type: string

      confirmation:
        description: 'Type APPLY to confirm Terraform deployment'
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: "ap-south-2"

jobs:
  terraform-apply:
    name: Terraform Apply - DEV
    runs-on: ubuntu-latest

    environment:
      name: dev

    defaults:
      run:
        shell: bash

    steps:
      # ==========================================================
      # Validate confirmation
      # ==========================================================

      - name: Validate deployment confirmation
        run: |
          set -euo pipefail

          if [ "${{ inputs.confirmation }}" != "APPLY" ]; then
            echo "ERROR: Deployment confirmation must be APPLY"
            exit 1
          fi

          echo "Deployment confirmation accepted."

      # ==========================================================
      # Checkout repository
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # Read Terraform version
      # ==========================================================

      - name: Read Terraform version
        id: terraform-version
        run: |
          set -euo pipefail

          test -f .terraform-version

          TERRAFORM_VERSION="$(tr -d '[:space:]' < .terraform-version)"

          if [[ ! "${TERRAFORM_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid Terraform version: ${TERRAFORM_VERSION}"
            exit 1
          fi

          echo "Terraform version: ${TERRAFORM_VERSION}"

          echo "terraform_version=${TERRAFORM_VERSION}" >> "${GITHUB_OUTPUT}"

      # ==========================================================
      # Setup Terraform
      # ==========================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.terraform-version.outputs.terraform_version }}
          terraform_wrapper: false

      - name: Verify Terraform version
        run: |
          set -euo pipefail

          terraform version

      # ==========================================================
      # AWS Authentication using GitHub OIDC
      # ==========================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::438064565553:role/GitHubActions-Terraform-Dev-Apply
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "AWS CALLER IDENTITY"
          echo "=========================================="

          aws sts get-caller-identity

      # ==========================================================
      # Terraform Init
      # ==========================================================

      - name: Terraform Init
        working-directory: environments/dev
        run: |
          set -euo pipefail

          terraform init -input=false

      # ==========================================================
      # Download approved Terraform plan artifact
      # ==========================================================

      - name: Download approved Terraform plan
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DOWNLOADING APPROVED TERRAFORM PLAN"
          echo "=========================================="

          echo "Source workflow run ID: ${RUN_ID}"

          mkdir -p /tmp/terraform-plan

          gh run download "${RUN_ID}" \
            --repo "${{ github.repository }}" \
            --name terraform-dev-plan \
            --dir /tmp/terraform-plan

          echo
          echo "Downloaded files:"
          find /tmp/terraform-plan -type f

      # ==========================================================
      # Validate downloaded plan
      # ==========================================================

      - name: Validate Terraform plan artifact
        run: |
          set -euo pipefail

          PLAN_FILE="/tmp/terraform-plan/tfplan"

          if [ ! -f "${PLAN_FILE}" ]; then
            echo "ERROR: Terraform plan file not found"
            exit 1
          fi

          echo "Terraform plan artifact found."

      # ==========================================================
      # Display approved plan
      # ==========================================================

      - name: Display approved Terraform plan
        working-directory: environments/dev
        run: |
          set -euo pipefail

          terraform show \
            -no-color \
            /tmp/terraform-plan/tfplan

      # ==========================================================
      # Terraform Apply
      # ==========================================================

      - name: Terraform Apply approved plan
        working-directory: environments/dev
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "APPLYING APPROVED TERRAFORM PLAN"
          echo "=========================================="

          terraform apply \
            -input=false \
            /tmp/terraform-plan/tfplan

      # ==========================================================
      # Deployment Summary
      # ==========================================================

      - name: Deployment summary
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "TERRAFORM APPLY COMPLETED SUCCESSFULLY"
          echo "=========================================="

          echo "Environment       : DEV"
          echo "Terraform version : ${{ steps.terraform-version.outputs.terraform_version }}"
          echo "AWS region        : ${{ env.AWS_REGION }}"
          echo "AWS authentication: GitHub OIDC"
          echo "Plan source run   : ${{ inputs.run_id }}"
          echo "Terraform init    : PASSED"
          echo "Terraform apply   : PASSED"
