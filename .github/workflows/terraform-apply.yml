name: Terraform Apply

on:
  workflow_run:
    workflows:
      - Terraform CI
    types:
      - completed

  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful Terraform CI run ID containing the Terraform plan"
        required: true
        type: string

      confirmation:
        description: "Type APPLY to confirm Terraform deployment"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: "ap-south-2"

jobs:
  terraform-apply:
    name: Terraform Apply - DEV

    if: |
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.confirmation == 'APPLY'
      )

    runs-on: ubuntu-latest

    environment:
      name: dev

    defaults:
      run:
        shell: bash

    steps:

      # ==========================================================
      # Deployment information
      # ==========================================================

      - name: Display deployment information
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "TERRAFORM DEV DEPLOYMENT"
          echo "=========================================="

          echo "Trigger event: ${{ github.event_name }}"

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "Deployment mode: Automatic"
            echo "Source branch : ${{ github.event.workflow_run.head_branch }}"
            echo "Source run ID : ${{ github.event.workflow_run.id }}"
            echo "Source SHA    : ${{ github.event.workflow_run.head_sha }}"
          else
            echo "Deployment mode: Manual"
            echo "Source run ID : ${{ inputs.run_id }}"
          fi

      # ==========================================================
      # Resolve source workflow run ID
      # ==========================================================

      - name: Resolve Terraform CI run ID
        id: source-run
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
          else
            RUN_ID="${{ inputs.run_id }}"
          fi

          if [ -z "${RUN_ID}" ]; then
            echo "ERROR: Terraform CI run ID is empty"
            exit 1
          fi

          echo "Terraform CI run ID: ${RUN_ID}"
          echo "run_id=${RUN_ID}" >> "${GITHUB_OUTPUT}"

      # ==========================================================
      # Resolve source commit
      # ==========================================================

      - name: Resolve source commit
        id: source-commit
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.source-run.outputs.run_id }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            COMMIT_SHA="${{ github.event.workflow_run.head_sha }}"
          else
            COMMIT_SHA="$(gh run view "${RUN_ID}" \
              --repo "${{ github.repository }}" \
              --json headSha \
              --jq '.headSha')"
          fi

          if [ -z "${COMMIT_SHA}" ] || [ "${COMMIT_SHA}" = "null" ]; then
            echo "ERROR: Could not determine source commit SHA"
            exit 1
          fi

          echo "Source commit: ${COMMIT_SHA}"
          echo "sha=${COMMIT_SHA}" >> "${GITHUB_OUTPUT}"

      # ==========================================================
      # Checkout exact commit used to create the plan
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source-commit.outputs.sha }}

      # ==========================================================
      # Read Terraform version
      # ==========================================================

      - name: Read Terraform version
        id: terraform-version
        run: |
          set -euo pipefail

          test -f .terraform-version

          TERRAFORM_VERSION="$(tr -d '[:space:]' < .terraform-version)"

          if [[ ! "${TERRAFORM_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid Terraform version: ${TERRAFORM_VERSION}"
            exit 1
          fi

          echo "Terraform version: ${TERRAFORM_VERSION}"
          echo "terraform_version=${TERRAFORM_VERSION}" >> "${GITHUB_OUTPUT}"

      # ==========================================================
      # Setup Terraform
      # ==========================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.terraform-version.outputs.terraform_version }}
          terraform_wrapper: false

      - name: Verify Terraform version
        run: |
          set -euo pipefail
          terraform version

      # ==========================================================
      # AWS Authentication using GitHub OIDC
      # ==========================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::438064565553:role/GitHubActions-Terraform-Dev-Apply
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      # ==========================================================
      # Terraform Init
      # ==========================================================

      - name: Terraform Init
        working-directory: environments/dev
        run: |
          set -euo pipefail
          terraform init -input=false

      # ==========================================================
      # Download exact Terraform plan from Terraform CI
      # ==========================================================

      - name: Download approved Terraform plan
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.source-run.outputs.run_id }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DOWNLOADING APPROVED TERRAFORM PLAN"
          echo "=========================================="

          echo "Source Terraform CI run: ${RUN_ID}"

          mkdir -p /tmp/terraform-plan

          gh run download "${RUN_ID}" \
            --repo "${{ github.repository }}" \
            --name terraform-dev-plan \
            --dir /tmp/terraform-plan

          echo
          echo "Downloaded files:"
          find /tmp/terraform-plan -type f -print

      # ==========================================================
      # Validate plan artifact
      # ==========================================================

      - name: Validate Terraform plan artifact
        run: |
          set -euo pipefail

          PLAN_FILE="/tmp/terraform-plan/tfplan"

          if [ ! -f "${PLAN_FILE}" ]; then
            echo "ERROR: Terraform plan file not found"
            exit 1
          fi

          if [ ! -s "${PLAN_FILE}" ]; then
            echo "ERROR: Terraform plan file is empty"
            exit 1
          fi

          echo "Terraform plan artifact validated:"
          ls -lh "${PLAN_FILE}"

      # ==========================================================
      # Display exact approved plan
      # ==========================================================

      - name: Display approved Terraform plan
        working-directory: environments/dev
        run: |
          set -euo pipefail

          terraform show \
            -no-color \
            /tmp/terraform-plan/tfplan

      # ==========================================================
      # Apply exact approved plan
      # ==========================================================

      - name: Terraform Apply approved plan
        working-directory: environments/dev
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "APPLYING APPROVED TERRAFORM PLAN"
          echo "=========================================="

          terraform apply \
            -input=false \
            /tmp/terraform-plan/tfplan

      # ==========================================================
      # Deployment summary
      # ==========================================================

      - name: Deployment summary
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "TERRAFORM APPLY COMPLETED SUCCESSFULLY"
          echo "=========================================="

          echo "Environment       : DEV"
          echo "Terraform version : ${{ steps.terraform-version.outputs.terraform_version }}"
          echo "AWS region        : ${{ env.AWS_REGION }}"
          echo "AWS authentication: GitHub OIDC"
          echo "Source CI run     : ${{ steps.source-run.outputs.run_id }}"
          echo "Source commit     : ${{ steps.source-commit.outputs.sha }}"
          echo "Terraform apply   : PASSED"
