name: AWS OIDC Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  aws-oidc-test:
    name: Test GitHub OIDC to AWS
    runs-on: ubuntu-latest

    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect GitHub OIDC claims
        shell: bash
        run: |
          set -euo pipefail

          echo "===== GITHUB OIDC CLAIMS ====="

          OIDC_TOKEN="$(
            curl -sSf \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com"
          )"

          export OIDC_TOKEN

          python3 <<'PY'
          import base64
          import json
          import os

          token = json.loads(os.environ["OIDC_TOKEN"])["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload).decode("utf-8")
          )

          interesting = [
              "iss",
              "aud",
              "sub",
              "repository",
              "repository_owner",
              "repository_id",
              "repository_owner_id",
              "environment",
              "ref",
              "workflow",
              "event_name",
          ]

          for key in interesting:
              if key in claims:
                  print(f"{key}: {claims[key]}")
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::438064565553:role/GitHubActions-Terraform-Dev
          aws-region: ap-south-2
          role-session-name: GitHubActionsOIDCTest
          allowed-account-ids: 438064565553

      - name: Verify AWS identity
        run: |
          echo "===== AWS IDENTITY ====="
          aws sts get-caller-identity

          echo
          echo "===== AWS REGION ====="
          aws configure get region

      - name: Verify state bucket access
        run: |
          echo "===== TERRAFORM STATE BUCKET ====="

          aws s3api head-bucket \
            --bucket aws-production-platform-terraform-state

          echo "Terraform state bucket is accessible."
