name: AWS DEV Deploy Role Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-deploy-role:
    name: Test DEV Deployment IAM Role
    runs-on: ubuntu-latest

    environment: dev

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::438064565553:role/GitHubActions-Terraform-Dev-Apply
          aws-region: ap-south-2
          role-session-name: GitHubActionsTerraformDevApplyTest
          allowed-account-ids: 438064565553

      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "AWS DEPLOY ROLE IDENTITY"
          echo "=========================================="

          aws sts get-caller-identity

          echo
          echo "=========================================="
          echo "AWS REGION"
          echo "=========================================="

          echo "AWS_REGION=${AWS_REGION}"
          echo "AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}"

      - name: Verify DEV infrastructure read access
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DEV ALB"
          echo "=========================================="

          aws elbv2 describe-load-balancers \
            --region ap-south-2 \
            --query 'LoadBalancers[?LoadBalancerName==`dev-platform-alb`].[LoadBalancerName,State.Code,DNSName]' \
            --output table

          echo
          echo "=========================================="
          echo "DEV TARGET HEALTH"
          echo "=========================================="

          TG_ARN=$(aws elbv2 describe-target-groups \
            --region ap-south-2 \
            --query 'TargetGroups[?TargetGroupName==`dev-platform-app-tg`].TargetGroupArn' \
            --output text)

          aws elbv2 describe-target-health \
            --region ap-south-2 \
            --target-group-arn "$TG_ARN" \
            --query 'TargetHealthDescriptions[*].[Target.Id,Target.Port,TargetHealth.State]' \
            --output table

      - name: Verify Terraform state access
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "TERRAFORM STATE"
          echo "=========================================="

          aws s3api head-bucket \
            --bucket aws-production-platform-terraform-state \
            --region ap-south-2

          aws s3api head-object \
            --bucket aws-production-platform-terraform-state \
            --key environments/dev/terraform.tfstate

          echo "Terraform DEV state is accessible."

      - name: Verify SSM AMI access
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "SSM AMI"
          echo "=========================================="

          aws ssm get-parameter \
            --region ap-south-2 \
            --name /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64 \
            --query 'Parameter.[Name,Value]' \
            --output table

      - name: Verify Access Analyzer access
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "ACCESS ANALYZER"
          echo "=========================================="

          aws accessanalyzer get-analyzer \
            --region ap-south-2 \
            --analyzer-name dev-platform-access-analyzer \
            --query 'analyzerName.[name,status,type]' \
            --output table
