name: Terraform Dev Apply

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read
  id-token: write

env:
  TF_WORKING_DIR: environments/dev
  TF_VERSION: "1.15.8"
  AWS_REGION: ap-south-2
  TF_IN_AUTOMATION: "true"

jobs:
  terraform-apply:
    name: Terraform Apply - Dev

    # Run only when a Pull Request targeting main is actually merged.
    # A PR that is simply closed will not trigger Terraform apply.
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'

    runs-on: ubuntu-latest

    environment:
      name: dev

    steps:
      # ----------------------------------------
      # Checkout merged main branch
      # ----------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------
      # Configure AWS authentication using OIDC
      # ----------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      # ----------------------------------------
      # Setup Terraform
      # ----------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Verify Terraform version
        shell: bash
        run: |
          set -euo pipefail
          terraform version

      # ----------------------------------------
      # Initialize Terraform backend
      # ----------------------------------------

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          terraform init -input=false

      # ----------------------------------------
      # Validate merged configuration
      # ----------------------------------------

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          terraform validate

      # ----------------------------------------
      # Apply merged main configuration
      # ----------------------------------------

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          terraform apply \
            -input=false \
            -auto-approve
