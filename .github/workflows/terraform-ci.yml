name: Terraform CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  terraform-validation:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # Read Terraform version from repository
      # ==========================================================

      - name: Read Terraform version
        id: terraform-version
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "READ TERRAFORM VERSION"
          echo "=========================================="

          test -f .terraform-version

          TERRAFORM_VERSION="$(tr -d '[:space:]' < .terraform-version)"

          if [[ ! "${TERRAFORM_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid Terraform version: ${TERRAFORM_VERSION}"
            exit 1
          fi

          echo "Terraform version: ${TERRAFORM_VERSION}"

          echo "terraform_version=${TERRAFORM_VERSION}" >> "${GITHUB_OUTPUT}"

      # ==========================================================
      # Install Terraform
      #
      # We intentionally install Terraform directly instead of
      # using hashicorp/setup-terraform because GitHub previously
      # returned 503/429 errors while downloading that action.
      # ==========================================================

      - name: Install Terraform
        shell: bash
        env:
          TERRAFORM_VERSION: ${{ steps.terraform-version.outputs.terraform_version }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "INSTALL TERRAFORM"
          echo "=========================================="

          echo "Terraform version: ${TERRAFORM_VERSION}"

          sudo apt-get update
          sudo apt-get install -y curl unzip

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
            -o /tmp/terraform.zip

          rm -rf /tmp/terraform
          mkdir -p /tmp/terraform

          unzip -q /tmp/terraform.zip -d /tmp/terraform

          sudo install \
            -m 0755 \
            /tmp/terraform/terraform \
            /usr/local/bin/terraform

      # ==========================================================
      # Verify Terraform installation
      # ==========================================================

      - name: Terraform version
        shell: bash
        env:
          EXPECTED_TERRAFORM_VERSION: ${{ steps.terraform-version.outputs.terraform_version }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "TERRAFORM VERSION"
          echo "=========================================="

          terraform version

          ACTUAL_TERRAFORM_VERSION="$(
            terraform version -json \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["terraform_version"])'
          )"

          echo
          echo "Expected: ${EXPECTED_TERRAFORM_VERSION}"
          echo "Actual  : ${ACTUAL_TERRAFORM_VERSION}"

          if [[ "${ACTUAL_TERRAFORM_VERSION}" != "${EXPECTED_TERRAFORM_VERSION}" ]]; then
            echo "ERROR: Terraform version mismatch."
            exit 1
          fi

          echo
          echo "Terraform version check passed."

      # ==========================================================
      # Terraform formatting
      # ==========================================================

      - name: Terraform format check
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "TERRAFORM FORMAT CHECK"
          echo "=========================================="

          terraform fmt -check -recursive environments/dev
          terraform fmt -check -recursive global/route53
          terraform fmt -check -recursive global/acm
          terraform fmt -check -recursive modules

          echo
          echo "Terraform formatting check passed."

      # ==========================================================
      # DEV validation
      #
      # Backend is disabled because this job must not require AWS
      # credentials or access Terraform remote state.
      # ==========================================================

      - name: Validate DEV Terraform
        working-directory: environments/dev
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VALIDATE DEV TERRAFORM"
          echo "=========================================="

          terraform init \
            -backend=false \
            -input=false

          terraform validate

          echo
          echo "DEV Terraform validation passed."

      # ==========================================================
      # Route 53 validation
      # ==========================================================

      - name: Validate Route 53 Terraform
        working-directory: global/route53
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VALIDATE ROUTE 53 TERRAFORM"
          echo "=========================================="

          terraform init \
            -backend=false \
            -input=false

          terraform validate

          echo
          echo "Route 53 Terraform validation passed."

      # ==========================================================
      # ACM validation
      # ==========================================================

      - name: Validate ACM Terraform
        working-directory: global/acm
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VALIDATE ACM TERRAFORM"
          echo "=========================================="

          terraform init \
            -backend=false \
            -input=false

          terraform validate

          echo
          echo "ACM Terraform validation passed."

      # ==========================================================
      # Shell script syntax
      # ==========================================================

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "SHELL SCRIPT VALIDATION"
          echo "=========================================="

          bash -n scripts/app-bootstrap.sh
          bash -n scripts/deploy-dev.sh
          bash -n scripts/destroy-dev.sh
          bash -n scripts/validate.sh

          echo
          echo "All shell scripts passed syntax validation."

      # ==========================================================
      # Final result
      # ==========================================================

      - name: Validation summary
        shell: bash
        env:
          TERRAFORM_VERSION: ${{ steps.terraform-version.outputs.terraform_version }}
        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo "TERRAFORM CI PASSED"
          echo "=========================================="

          echo "Terraform version : ${TERRAFORM_VERSION}"
          echo "AWS authentication: Not required"
          echo "Terraform plan    : Not performed"
          echo "Terraform apply   : Not performed"
          echo
          echo "Static validation completed successfully."
