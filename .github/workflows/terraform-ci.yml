name: Terraform CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
      - "feature/**"

  workflow_dispatch:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  terraform-validation:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:
      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # Read Terraform version
      # ==========================================================

      - name: Read Terraform version
        id: terraform-version
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "READ TERRAFORM VERSION"
          echo "=========================================="

          test -f .terraform-version

          TERRAFORM_VERSION="$(tr -d '[:space:]' < .terraform-version)"

          if [[ ! "${TERRAFORM_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid Terraform version: ${TERRAFORM_VERSION}"
            exit 1
          fi

          echo "Terraform version: ${TERRAFORM_VERSION}"

          echo "terraform_version=${TERRAFORM_VERSION}" >> "${GITHUB_OUTPUT}"

      # ==========================================================
      # Install Terraform
      # ==========================================================

      - name: Install Terraform
        shell: bash
        env:
          TERRAFORM_VERSION: ${{ steps.terraform-version.outputs.terraform_version }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "INSTALL TERRAFORM"
          echo "=========================================="

          sudo apt-get update
          sudo apt-get install -y curl unzip

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 5 \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
            --output /tmp/terraform.zip

          rm -rf /tmp/terraform
          mkdir -p /tmp/terraform

          unzip -q /tmp/terraform.zip -d /tmp/terraform

          sudo install \
            -m 0755 \
            /tmp/terraform/terraform \
            /usr/local/bin/terraform

          rm -rf /tmp/terraform
          rm -f /tmp/terraform.zip

          terraform version

      # ==========================================================
      # Terraform formatting
      # ==========================================================

      - name: Terraform format check
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "TERRAFORM FORMAT CHECK"
          echo "=========================================="

          terraform fmt -check -recursive bootstrap
          terraform fmt -check -recursive environments
          terraform fmt -check -recursive global
          terraform fmt -check -recursive modules

      # ==========================================================
      # Bootstrap validation
      # ==========================================================

      - name: Validate Bootstrap
        working-directory: bootstrap
        shell: bash
        run: |
          set -euo pipefail

          terraform init \
            -backend=false \
            -input=false

          terraform validate

      # ==========================================================
      # DEV environment validation
      # ==========================================================

      - name: Validate DEV environment
        working-directory: environments/dev
        shell: bash
        run: |
          set -euo pipefail

          terraform init \
            -backend=false \
            -input=false

          terraform validate

      # ==========================================================
      # Route53 validation
      # ==========================================================

      - name: Validate Route53
        working-directory: global/route53
        shell: bash
        run: |
          set -euo pipefail

          terraform init \
            -backend=false \
            -input=false

          terraform validate

      # ==========================================================
      # ACM validation
      # ==========================================================

      - name: Validate ACM
        working-directory: global/acm
        shell: bash
        run: |
          set -euo pipefail

          terraform init \
            -backend=false \
            -input=false

          terraform validate

      # ==========================================================
      # VPC module validation
      # ==========================================================

      - name: Validate VPC module
        working-directory: modules/vpc
        shell: bash
        run: |
          set -euo pipefail

          terraform init \
            -backend=false \
            -input=false

          terraform validate

      # ==========================================================
      # Security module validation
      # ==========================================================

      - name: Validate Security module
        working-directory: modules/security
        shell: bash
        run: |
          set -euo pipefail

          terraform init \
            -backend=false \
            -input=false

          terraform validate

      # ==========================================================
      # IAM module validation
      # ==========================================================

      - name: Validate IAM module
        working-directory: modules/iam
        shell: bash
        run: |
          set -euo pipefail

          terraform init \
            -backend=false \
            -input=false

          terraform validate

      # ==========================================================
      # Compute module validation
      # ==========================================================

      - name: Validate Compute module
        working-directory: modules/compute
        shell: bash
        run: |
          set -euo pipefail

          terraform init \
            -backend=false \
            -input=false

          terraform validate

      # ==========================================================
      # Shell script validation
      # ==========================================================

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "SHELL SCRIPT VALIDATION"
          echo "=========================================="

          for script in \
            scripts/app-bootstrap.sh \
            scripts/deploy-dev.sh \
            scripts/destroy-dev.sh \
            scripts/validate.sh
          do
            if [ -f "${script}" ]; then
              echo "Checking ${script}"
              bash -n "${script}"
            else
              echo "Skipping missing script: ${script}"
            fi
          done

      # ==========================================================
      # Final summary
      # ==========================================================

      - name: CI summary
        shell: bash
        env:
          TERRAFORM_VERSION: ${{ steps.terraform-version.outputs.terraform_version }}
        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo "TERRAFORM CI COMPLETED SUCCESSFULLY"
          echo "=========================================="

          echo "Terraform version : ${TERRAFORM_VERSION}"
          echo "Terraform format  : PASSED"
          echo "Terraform validate: PASSED"
          echo "Shell validation  : PASSED"
          echo "AWS authentication: NOT USED"
          echo "Terraform plan    : NOT RUN"
          echo "Terraform apply   : NOT RUN"
