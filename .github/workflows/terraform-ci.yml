name: Terraform CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
      - "feature/**"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  terraform-validation:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:
      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # Read Terraform version
      # ==========================================================

      - name: Read Terraform version
        id: terraform-version
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "READ TERRAFORM VERSION"
          echo "=========================================="

          test -f .terraform-version

          TERRAFORM_VERSION="$(tr -d '[:space:]' < .terraform-version)"

          if [[ ! "${TERRAFORM_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid Terraform version: ${TERRAFORM_VERSION}"
            exit 1
          fi

          echo "Terraform version: ${TERRAFORM_VERSION}"

          echo "terraform_version=${TERRAFORM_VERSION}" >> "${GITHUB_OUTPUT}"

      # ==========================================================
      # Install Terraform
      # ==========================================================

      - name: Install Terraform
        shell: bash
        env:
          TERRAFORM_VERSION: ${{ steps.terraform-version.outputs.terraform_version }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "INSTALL TERRAFORM"
          echo "=========================================="

          sudo apt-get update
          sudo apt-get install -y curl unzip

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 5 \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
            --output /tmp/terraform.zip

          rm -rf /tmp/terraform
          mkdir -p /tmp/terraform

          unzip -q /tmp/terraform.zip -d /tmp/terraform

          sudo install \
            -m 0755 \
            /tmp/terraform/terraform \
            /usr/local/bin/terraform

          rm -rf /tmp/terraform
          rm -f /tmp/terraform.zip

          terraform version

      # ==========================================================
      # Terraform formatting
      # ==========================================================

      - name: Terraform format check
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "TERRAFORM FORMAT CHECK"
          echo "=========================================="

          terraform fmt -check -recursive bootstrap
          terraform fmt -check -recursive environments
          terraform fmt -check -recursive global
          terraform fmt -check -recursive modules

      # ==========================================================
      # Bootstrap validation
      # ==========================================================

      - name: Validate Bootstrap
        working-directory: bootstrap
        shell: bash
        run: |
          set -euo pipefail

          terraform init \
            -backend=false \
            -input=false

          terraform validate

      # ==========================================================
      # DEV environment validation
      # ==========================================================

      - name: Validate DEV environment
        working-directory: environments/dev
        shell: bash
        run: |
          set -euo pipefail

          terraform init \
            -backend=false \
            -input=false

          terraform validate

      # ==========================================================
      # Route53 validation
      # ==========================================================

      - name: Validate Route53
        working-directory: global/route53
        shell: bash
        run: |
          set -euo pipefail

          terraform init \
            -backend=false \
            -input=false

          terraform validate

      # ==========================================================
      # ACM validation
      # ==========================================================

      - name: Validate ACM
        working-directory: global/acm
        shell: bash
        run: |
          set -euo pipefail

          terraform init \
            -backend=false \
            -input=false

          terraform validate

      # ==========================================================
      # VPC module validation
      # ==========================================================

      - name: Validate VPC module
        working-directory: modules/vpc
        shell: bash
        run: |
          set -euo pipefail

          terraform init \
            -backend=false \
            -input=false

          terraform validate

      # ==========================================================
      # Security module validation
      # ==========================================================

      - name: Validate Security module
        working-directory: modules/security
        shell: bash
        run: |
          set -euo pipefail

          terraform init \
            -backend=false \
            -input=false

          terraform validate

      # ==========================================================
      # IAM module validation
      # ==========================================================

      - name: Validate IAM module
        working-directory: modules/iam
        shell: bash
        run: |
          set -euo pipefail

          terraform init \
            -backend=false \
            -input=false

          terraform validate

      # ==========================================================
      # Compute module validation
      # ==========================================================

      - name: Validate Compute module
        working-directory: modules/compute
        shell: bash
        run: |
          set -euo pipefail

          terraform init \
            -backend=false \
            -input=false

          terraform validate
      
      # ==========================================================
      # TFLint
      # ==========================================================

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v5
        with:
          tflint_version: latest

      - name: Initialize TFLint
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "TFLINT INITIALIZATION"
          echo "=========================================="

          tflint --init

      - name: Run TFLint
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "TFLINT VALIDATION"
          echo "=========================================="

          tflint --recursive
      
      # ==========================================================
      # Checkov security scan
      # ==========================================================

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          quiet: true
      
        

      # ==========================================================
      # Shell script validation
      # ==========================================================

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "SHELL SCRIPT VALIDATION"
          echo "=========================================="

          for script in \
            scripts/app-bootstrap.sh \
            scripts/deploy-dev.sh \
            scripts/destroy-dev.sh \
            scripts/validate.sh
          do
            if [ -f "${script}" ]; then
              echo "Checking ${script}"
              bash -n "${script}"
            else
              echo "Skipping missing script: ${script}"
            fi
          done

        # ==========================================================
  # Terraform Plan Job
  # Runs only after Terraform Validation succeeds
  # ==========================================================

  terraform-plan:
    name: Terraform Plan - DEV
    needs: terraform-validation
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        shell: bash

    env:
      TF_VERSION: "1.15.8"
      AWS_REGION: "ap-south-2"
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      AWS_ROLE_TO_ASSUME: "arn:aws:iam::438064565553:role/GitHubActions-Terraform-CI"

    steps:

      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # Setup Terraform
      # ==========================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Verify Terraform version
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "TERRAFORM VERSION"
          echo "=========================================="

          terraform version

      # ==========================================================
      # AWS Authentication using GitHub OIDC
      # ==========================================================

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "AWS CALLER IDENTITY"
          echo "=========================================="

          aws sts get-caller-identity

      # ==========================================================
      # Terraform Init
      # ==========================================================

      - name: Terraform Init - DEV
        working-directory: environments/dev
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "TERRAFORM INIT - DEV"
          echo "=========================================="

          terraform init -input=false

      # ==========================================================
      # Terraform Plan
      # ==========================================================

      - name: Terraform Plan - DEV
        working-directory: environments/dev
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "TERRAFORM PLAN - DEV"
          echo "=========================================="

          terraform plan \
            -input=false \
            -out=tfplan

      # ==========================================================
      # Generate Human-Readable Plan
      # ==========================================================

      - name: Generate plan summary
        working-directory: environments/dev
        run: |
          set -euo pipefail

          terraform show \
            -no-color \
            tfplan | tee tfplan.txt

      # ==========================================================
      # Upload Binary Terraform Plan
      # ==========================================================

      - name: Upload Terraform binary plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-dev-plan
          path: environments/dev/tfplan
          if-no-files-found: error
          retention-days: 7

      # ==========================================================
      # Upload Human-Readable Plan
      # ==========================================================

      - name: Upload Terraform plan summary
        uses: actions/upload-artifact@v4
        with:
          name: terraform-dev-plan-summary
          path: environments/dev/tfplan.txt
          if-no-files-found: error
          retention-days: 7

      # ==========================================================
      # GitHub Job Summary
      # ==========================================================

      - name: Write job summary
        run: |
          {
            echo "## Terraform Plan - DEV"
            echo ""
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Environment | DEV |"
            echo "| Terraform | ${{ env.TF_VERSION }} |"
            echo "| AWS Region | ${{ env.AWS_REGION }} |"
            echo "| Authentication | GitHub OIDC |"
            echo ""
            echo "### Result"
            echo ""
            echo "Terraform plan completed successfully."
          } >> "$GITHUB_STEP_SUMMARY"

      # ==========================================================
      # Final Plan Summary
      # ==========================================================

      - name: Plan summary
        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo "TERRAFORM PLAN COMPLETED SUCCESSFULLY"
          echo "=========================================="

          echo "Environment       : DEV"
          echo "Terraform version : ${{ env.TF_VERSION }}"
          echo "AWS region        : ${{ env.AWS_REGION }}"
          echo "AWS authentication: GitHub OIDC"
          echo "Terraform init    : PASSED"
          echo "Terraform plan    : PASSED"
          echo "Plan artifact     : UPLOADED"
          echo "Plan summary      : UPLOADED"
      
      # ==========================================================
      # Final CI summary
      # ==========================================================

      - name: CI summary
        shell: bash
        env:
          TERRAFORM_VERSION: ${{ steps.terraform-version.outputs.terraform_version }}
        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo "TERRAFORM CI COMPLETED SUCCESSFULLY"
          echo "=========================================="

          echo "Terraform version : ${TERRAFORM_VERSION}"
          echo "Terraform format  : PASSED"
          echo "Terraform validate: PASSED"
          echo "TFLint            : PASSED"
          echo "Checkov           : PASSED"
          echo "Shell validation  : PASSED"
          echo "AWS authentication: NOT USED"
          echo "Terraform plan    : NEXT JOB"
          echo "Terraform apply   : NOT RUN"
      
