name: Terraform CI

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-2
  AWS_ACCOUNT_ID: "438064565553"
  AWS_ROLE_ARN: arn:aws:iam::438064565553:role/GitHubActions-Terraform-Dev
  TERRAFORM_VERSION: "1.12.2"
  STATE_BUCKET: aws-production-platform-terraform-state

jobs:

  # ============================================================
  # JOB 1: Terraform syntax and configuration validation
  # ============================================================
  terraform-validation:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Install Terraform without hashicorp/setup-terraform
      # --------------------------------------------------------
      - name: Install Terraform
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Installing Terraform ${TERRAFORM_VERSION}"
          echo "=========================================="

          sudo apt-get update
          sudo apt-get install -y curl unzip

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 5 \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
            --output /tmp/terraform.zip

          unzip -o /tmp/terraform.zip -d /tmp/terraform

          sudo install \
            -m 0755 \
            /tmp/terraform/terraform \
            /usr/local/bin/terraform

          rm -rf /tmp/terraform /tmp/terraform.zip

          terraform version

      # --------------------------------------------------------
      # Terraform formatting
      # --------------------------------------------------------
      - name: Terraform format check
        shell: bash
        run: |
          set -euo pipefail

          terraform fmt -check -recursive environments/dev
          terraform fmt -check -recursive global/route53
          terraform fmt -check -recursive global/acm
          terraform fmt -check -recursive modules

      # --------------------------------------------------------
      # DEV validation
      #
      # -backend=false is intentional.
      # Validation does not need AWS credentials or S3 state.
      # --------------------------------------------------------
      - name: Validate DEV Terraform
        working-directory: environments/dev
        shell: bash
        run: |
          set -euo pipefail

          terraform init \
            -backend=false \
            -input=false

          terraform validate

      # --------------------------------------------------------
      # Route53 validation
      # --------------------------------------------------------
      - name: Validate Route53 Terraform
        working-directory: global/route53
        shell: bash
        run: |
          set -euo pipefail

          terraform init \
            -backend=false \
            -input=false

          terraform validate

      # --------------------------------------------------------
      # ACM validation
      # --------------------------------------------------------
      - name: Validate ACM Terraform
        working-directory: global/acm
        shell: bash
        run: |
          set -euo pipefail

          terraform init \
            -backend=false \
            -input=false

          terraform validate

      # --------------------------------------------------------
      # Shell script validation
      # --------------------------------------------------------
      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail

          bash -n scripts/app-bootstrap.sh
          bash -n scripts/deploy-dev.sh
          bash -n scripts/destroy-dev.sh
          bash -n scripts/validate.sh

          echo "All shell scripts passed syntax validation."


  # ============================================================
  # JOB 2: AWS-authenticated Terraform plan
  # ============================================================
  terraform-dev-plan:
    name: Terraform DEV Plan
    runs-on: ubuntu-latest

    # IMPORTANT:
    # This environment must exist in GitHub and must match
    # the IAM OIDC trust policy.
    environment: dev

    needs:
      - terraform-validation

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Install Terraform
      # --------------------------------------------------------
      - name: Install Terraform
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Installing Terraform ${TERRAFORM_VERSION}"
          echo "=========================================="

          sudo apt-get update
          sudo apt-get install -y curl unzip

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 5 \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
            --output /tmp/terraform.zip

          unzip -o /tmp/terraform.zip -d /tmp/terraform

          sudo install \
            -m 0755 \
            /tmp/terraform/terraform \
            /usr/local/bin/terraform

          rm -rf /tmp/terraform /tmp/terraform.zip

          terraform version

      # --------------------------------------------------------
      # AWS OIDC authentication
      # --------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsTerraformPlan
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      # --------------------------------------------------------
      # Verify AWS identity
      #
      # DO NOT use:
      #   aws configure get region
      #
      # The AWS credentials action sets AWS_REGION and
      # AWS_DEFAULT_REGION as environment variables.
      # --------------------------------------------------------
      - name: Verify AWS authentication
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "AWS IDENTITY"
          echo "=========================================="

          aws sts get-caller-identity

          echo
          echo "=========================================="
          echo "AWS REGION"
          echo "=========================================="

          echo "AWS_REGION=${AWS_REGION}"
          echo "AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}"

          if [[ "${AWS_REGION}" != "ap-south-2" ]]; then
            echo "ERROR: Unexpected AWS region."
            exit 1
          fi

          echo
          echo "AWS authentication verified successfully."

      # --------------------------------------------------------
      # Verify Terraform state bucket
      # --------------------------------------------------------
      - name: Verify Terraform state bucket
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "TERRAFORM STATE BUCKET"
          echo "=========================================="

          aws s3api head-bucket \
            --bucket "${STATE_BUCKET}"

          echo
          echo "Terraform state bucket is accessible."

      # --------------------------------------------------------
      # Verify AWS resources needed during Terraform plan
      #
      # These checks make IAM failures much easier to diagnose.
      # --------------------------------------------------------
      - name: Verify Terraform read permissions
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY TERRAFORM READ ACCESS"
          echo "=========================================="

          echo
          echo "EC2 / VPC:"
          aws ec2 describe-vpcs \
            --region "${AWS_REGION}" \
            --max-items 1 \
            >/dev/null

          echo "OK - EC2"

          echo
          echo "SSM:"
          aws ssm get-parameter \
            --name "/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64" \
            --region "${AWS_REGION}" \
            >/dev/null

          echo "OK - SSM"

          echo
          echo "Access Analyzer:"
          aws accessanalyzer get-analyzer \
            --analyzer-name "dev-platform-access-analyzer" \
            --region "${AWS_REGION}" \
            >/dev/null

          echo "OK - Access Analyzer"

          echo
          echo "ACM:"
          aws acm list-certificates \
            --region "${AWS_REGION}" \
            --max-items 1 \
            >/dev/null

          echo "OK - ACM"

          echo
          echo "Route53:"
          aws route53 list-hosted-zones \
            --max-items 1 \
            >/dev/null

          echo "OK - Route53"

          echo
          echo "ELB:"
          aws elbv2 describe-load-balancers \
            --region "${AWS_REGION}" \
            --page-size 1 \
            >/dev/null

          echo "OK - ELB"

          echo
          echo "IAM:"
          aws iam list-roles \
            --max-items 1 \
            >/dev/null

          echo "OK - IAM"

          echo
          echo "All required AWS read checks passed."

      # --------------------------------------------------------
      # Terraform plan
      #
      # IMPORTANT:
      # This performs PLAN only.
      # It does NOT modify infrastructure.
      # --------------------------------------------------------
      - name: Terraform DEV init
        working-directory: environments/dev
        shell: bash
        run: |
          set -euo pipefail

          terraform init \
            -input=false \
            -reconfigure

      - name: Terraform DEV plan
        working-directory: environments/dev
        shell: bash
        run: |
          set -euo pipefail

          terraform plan \
            -input=false \
            -no-color \
            -out=dev.tfplan

          echo
          echo "=========================================="
          echo "TERRAFORM PLAN COMPLETED SUCCESSFULLY"
          echo "=========================================="

      # --------------------------------------------------------
      # Show a human-readable plan summary
      # --------------------------------------------------------
      - name: Terraform plan summary
        working-directory: environments/dev
        shell: bash
        run: |
          set -euo pipefail

          terraform show \
            -no-color \
            dev.tfplan
