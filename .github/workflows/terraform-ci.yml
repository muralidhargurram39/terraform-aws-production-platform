name: Terraform CI

on:
  push:
    branches:
      - "feature/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.15.8"
  AWS_REGION: ap-south-2
  TF_IN_AUTOMATION: "true"
  AWS_ROLE_TO_ASSUME: "arn:aws:iam::438064565553:role/GitHubActions-Terraform-CI"

jobs:
  terraform-ci:
    name: Terraform CI
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------
      # Checkout
      # ----------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------
      # Terraform Setup
      # ----------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Verify Terraform version
        run: |
          set -euo pipefail
          terraform version

      # ----------------------------------------
      # Terraform Format
      # ----------------------------------------

      - name: Terraform Format Check
        run: |
          set -euo pipefail
          terraform fmt -check -recursive

      # ----------------------------------------
      # Terraform Validation
      # ----------------------------------------

      - name: Terraform Init - Bootstrap
        working-directory: bootstrap
        run: terraform init -backend=false -input=false

      - name: Terraform Validate - Bootstrap
        working-directory: bootstrap
        run: terraform validate

      - name: Terraform Init - VPC Module
        working-directory: modules/vpc
        run: terraform init -backend=false -input=false

      - name: Terraform Validate - VPC Module
        working-directory: modules/vpc
        run: terraform validate

      - name: Terraform Init - Security Module
        working-directory: modules/security
        run: terraform init -backend=false -input=false

      - name: Terraform Validate - Security Module
        working-directory: modules/security
        run: terraform validate

      - name: Terraform Init - IAM Module
        working-directory: modules/iam
        run: terraform init -backend=false -input=false

      - name: Terraform Validate - IAM Module
        working-directory: modules/iam
        run: terraform validate

      - name: Terraform Init - Compute Module
        working-directory: modules/compute
        run: terraform init -backend=false -input=false

      - name: Terraform Validate - Compute Module
        working-directory: modules/compute
        run: terraform validate

      - name: Terraform Init - Route53
        working-directory: global/route53
        run: terraform init -backend=false -input=false

      - name: Terraform Validate - Route53
        working-directory: global/route53
        run: terraform validate

      - name: Terraform Init - ACM
        working-directory: global/acm
        run: terraform init -backend=false -input=false

      - name: Terraform Validate - ACM
        working-directory: global/acm
        run: terraform validate

      - name: Terraform Init - Dev Environment
        working-directory: environments/dev
        run: terraform init -backend=false -input=false

      - name: Terraform Validate - Dev Environment
        working-directory: environments/dev
        run: terraform validate

      # ----------------------------------------
      # TFLint
      # ----------------------------------------

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v5
        with:
          tflint_version: latest

      - name: Initialize TFLint
        run: |
          set -euo pipefail
          tflint --init

      - name: Run TFLint
        run: |
          set -euo pipefail
          tflint --recursive

      # ----------------------------------------
      # Checkov Security Scan
      # ----------------------------------------

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          quiet: true

      # ----------------------------------------
      # AWS Authentication
      # Required only after all checks pass
      # ----------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      # ----------------------------------------
      # Terraform Plan
      # ----------------------------------------

      - name: Terraform Init - Dev Backend
        working-directory: environments/dev
        run: |
          set -euo pipefail
          terraform init -input=false

      - name: Terraform Plan - Dev
        working-directory: environments/dev
        run: |
          set -euo pipefail

          terraform plan \
            -input=false \
            -out=tfplan

      # ----------------------------------------
      # Upload Plan Artifact
      # ----------------------------------------

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-dev-plan
          path: environments/dev/tfplan
          retention-days: 7
