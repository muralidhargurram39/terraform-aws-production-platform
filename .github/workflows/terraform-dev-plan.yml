name: Terraform DEV Plan

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-2
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  terraform-plan:
    name: Terraform DEV Plan
    runs-on: ubuntu-latest

    environment: dev

    steps:
      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # Read repository Terraform version
      # ==========================================================

      - name: Read Terraform version
        id: terraform-version
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "READ TERRAFORM VERSION"
          echo "=========================================="

          test -f .terraform-version

          TERRAFORM_VERSION="$(tr -d '[:space:]' < .terraform-version)"

          if [[ ! "${TERRAFORM_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid Terraform version: ${TERRAFORM_VERSION}"
            exit 1
          fi

          echo "Terraform version: ${TERRAFORM_VERSION}"

          echo "terraform_version=${TERRAFORM_VERSION}" >> "${GITHUB_OUTPUT}"

      # ==========================================================
      # Install exact Terraform version
      #
      # Direct installation is intentional.
      # This avoids the previous setup-terraform download
      # problems (503 / 429).
      # ==========================================================

      - name: Install Terraform
        shell: bash
        env:
          TERRAFORM_VERSION: ${{ steps.terraform-version.outputs.terraform_version }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "INSTALL TERRAFORM"
          echo "=========================================="

          echo "Terraform version: ${TERRAFORM_VERSION}"

          sudo apt-get update
          sudo apt-get install -y curl unzip

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
            -o /tmp/terraform.zip

          rm -rf /tmp/terraform
          mkdir -p /tmp/terraform

          unzip -q /tmp/terraform.zip -d /tmp/terraform

          sudo install \
            -m 0755 \
            /tmp/terraform/terraform \
            /usr/local/bin/terraform

      # ==========================================================
      # Verify Terraform version
      # ==========================================================

      - name: Terraform version
        shell: bash
        env:
          EXPECTED_TERRAFORM_VERSION: ${{ steps.terraform-version.outputs.terraform_version }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "TERRAFORM VERSION"
          echo "=========================================="

          terraform version

          ACTUAL_TERRAFORM_VERSION="$(
            terraform version -json \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["terraform_version"])'
          )"

          echo
          echo "Expected: ${EXPECTED_TERRAFORM_VERSION}"
          echo "Actual  : ${ACTUAL_TERRAFORM_VERSION}"

          if [[ "${ACTUAL_TERRAFORM_VERSION}" != "${EXPECTED_TERRAFORM_VERSION}" ]]; then
            echo "ERROR: Terraform version mismatch."
            exit 1
          fi

          echo
          echo "Terraform version check passed."

      # ==========================================================
      # Configure AWS OIDC
      #
      # IMPORTANT:
      # This is the READ-ONLY Terraform DEV role.
      # DO NOT replace it with the Apply role.
      # ==========================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::438064565553:role/GitHubActions-Terraform-Dev
          aws-region: ap-south-2
          role-session-name: GitHubActionsTerraformPlan
          allowed-account-ids: 438064565553

      # ==========================================================
      # Verify AWS identity
      # ==========================================================

      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "AWS IDENTITY"
          echo "=========================================="

          aws sts get-caller-identity

          echo
          echo "AWS_REGION=${AWS_REGION}"
          echo "AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}"

      # ==========================================================
      # Terraform formatting
      # ==========================================================

      - name: Terraform format check
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "TERRAFORM FORMAT CHECK"
          echo "=========================================="

          terraform fmt -check -recursive environments/dev
          terraform fmt -check -recursive global/route53
          terraform fmt -check -recursive global/acm
          terraform fmt -check -recursive modules

          echo
          echo "Terraform formatting check passed."

      # ==========================================================
      # Initialize DEV Terraform
      #
      # Backend remains enabled because this is an actual DEV
      # plan against the existing Terraform state.
      # ==========================================================

      - name: Terraform init
        working-directory: environments/dev
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "TERRAFORM INIT"
          echo "=========================================="

          terraform init \
            -input=false

      # ==========================================================
      # Validate DEV Terraform
      # ==========================================================

      - name: Terraform validate
        working-directory: environments/dev
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "TERRAFORM VALIDATE"
          echo "=========================================="

          terraform validate

          echo
          echo "Terraform validation passed."

      # ==========================================================
      # Terraform plan
      # ==========================================================

      - name: Terraform plan
        working-directory: environments/dev
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "TERRAFORM PLAN"
          echo "=========================================="

          terraform plan \
            -input=false \
            -out=dev.tfplan

      # ==========================================================
      # Display human-readable plan
      # ==========================================================

      - name: Show Terraform plan
        working-directory: environments/dev
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "TERRAFORM PLAN OUTPUT"
          echo "=========================================="

          terraform show \
            -no-color \
            dev.tfplan \
            > dev-plan.txt

          cat dev-plan.txt

      # ==========================================================
      # Upload plan artifact
      # ==========================================================

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-dev-plan-${{ github.run_number }}
          path: |
            environments/dev/dev.tfplan
            environments/dev/dev-plan.txt
          retention-days: 7

      # ==========================================================
      # Final summary
      # ==========================================================

      - name: Plan summary
        shell: bash
        env:
          TERRAFORM_VERSION: ${{ steps.terraform-version.outputs.terraform_version }}
        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo "TERRAFORM DEV PLAN COMPLETED"
          echo "=========================================="

          echo "Terraform version : ${TERRAFORM_VERSION}"
          echo "AWS region        : ${AWS_REGION}"
          echo "AWS role          : GitHubActions-Terraform-Dev"
          echo "Terraform apply   : NOT PERFORMED"
          echo "Plan artifact     : UPLOADED"
