name: Terraform DEV Plan

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  terraform-plan:
    name: Terraform DEV Plan
    runs-on: ubuntu-latest

    environment: dev

    env:
      AWS_REGION: ap-south-2
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::438064565553:role/GitHubActions-Terraform-Dev-Apply
          aws-region: ap-south-2
          role-session-name: GitHubActionsTerraformPlan
          allowed-account-ids: 438064565553

      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "AWS IDENTITY"
          echo "=========================================="

          aws sts get-caller-identity

          echo
          echo "AWS_REGION=${AWS_REGION}"
          echo "AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}"

      - name: Install Terraform
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            gnupg \
            software-properties-common \
            curl \
            lsb-release

          curl -fsSL https://apt.releases.hashicorp.com/gpg \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg >/dev/null

          echo \
            "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/hashicorp.list

          sudo apt-get update
          sudo apt-get install -y terraform

      - name: Terraform version
        run: terraform version

      - name: Terraform format check
        shell: bash
        run: |
          set -euo pipefail

          terraform fmt -check -recursive environments/dev
          terraform fmt -check -recursive global/route53
          terraform fmt -check -recursive global/acm

      - name: Terraform init
        working-directory: environments/dev
        shell: bash
        run: |
          set -euo pipefail

          terraform init \
            -input=false

      - name: Terraform validate
        working-directory: environments/dev
        shell: bash
        run: |
          set -euo pipefail

          terraform validate

      - name: Terraform plan
        working-directory: environments/dev
        shell: bash
        run: |
          set -euo pipefail

          terraform plan \
            -input=false \
            -out=dev.tfplan

      - name: Show Terraform plan
        working-directory: environments/dev
        shell: bash
        run: |
          set -euo pipefail

          terraform show \
            -no-color \
            dev.tfplan \
            > dev-plan.txt

          cat dev-plan.txt

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-dev-plan-${{ github.run_number }}
          path: |
            environments/dev/dev.tfplan
            environments/dev/dev-plan.txt
          retention-days: 7
