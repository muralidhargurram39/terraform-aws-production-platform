name: Terraform Plan

on:
  pull_request:
    branches:
      - main
    paths:
      - "bootstrap/**"
      - "environments/**"
      - "modules/**"
      - "global/**"
      - ".github/workflows/terraform-plan.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.15.8"
  AWS_REGION: "ap-south-2"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

  AWS_ROLE_TO_ASSUME: "arn:aws:iam::438064565553:role/GitHubActions-Terraform-CI"

jobs:
  terraform-plan:
    name: Terraform Plan - DEV
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:

      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # Terraform
      # ==========================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Verify Terraform version
        run: |
          set -euo pipefail

          terraform version

      # ==========================================================
      # AWS Authentication
      # ==========================================================

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "AWS CALLER IDENTITY"
          echo "=========================================="

          aws sts get-caller-identity

      # ==========================================================
      # Terraform Init
      # ==========================================================

      - name: Terraform Init
        working-directory: environments/dev
        run: |
          set -euo pipefail

          terraform init \
            -input=false

      # ==========================================================
      # Terraform Plan
      # ==========================================================

      - name: Terraform Plan
        working-directory: environments/dev
        run: |
          set -euo pipefail

          terraform plan \
            -input=false \
            -out=tfplan

      # ==========================================================
      # Display Plan Summary
      # ==========================================================

      - name: Terraform Plan Summary
        working-directory: environments/dev
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "TERRAFORM PLAN SUMMARY"
          echo "=========================================="

          terraform show -no-color tfplan

      # ==========================================================
      # Upload Plan Artifact
      # ==========================================================

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-dev-plan
          path: environments/dev/tfplan
          retention-days: 7

      # ==========================================================
      # Summary
      # ==========================================================

      - name: Plan summary
        run: |
          echo "=========================================="
          echo "TERRAFORM PLAN COMPLETED SUCCESSFULLY"
          echo "=========================================="
          echo ""
          echo "Environment       : DEV"
          echo "Terraform version : ${{ env.TF_VERSION }}"
          echo "AWS region        : ${{ env.AWS_REGION }}"
          echo "AWS authentication: OIDC"
          echo "Terraform init    : PASSED"
          echo "Terraform plan    : PASSED"
