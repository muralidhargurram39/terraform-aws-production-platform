name: Terraform Plan

on:
  pull_request:
    branches:
      - main
    paths:
      - "bootstrap/**"
      - "environments/**"
      - "modules/**"
      - "global/**"
      - ".github/workflows/terraform-plan.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.15.8"
  AWS_REGION: "ap-south-2"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

  AWS_ROLE_TO_ASSUME: "arn:aws:iam::438064565553:role/GitHubActions-Terraform-CI"

jobs:
  terraform-plan:
    name: Terraform Plan - DEV
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:

      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # Setup Terraform
      # ==========================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Verify Terraform version
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "TERRAFORM VERSION"
          echo "=========================================="

          terraform version

      # ==========================================================
      # AWS Authentication
      # ==========================================================

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "AWS CALLER IDENTITY"
          echo "=========================================="

          aws sts get-caller-identity

      # ==========================================================
      # Terraform Init
      # ==========================================================

      - name: Terraform Init - DEV
        working-directory: environments/dev
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "TERRAFORM INIT - DEV"
          echo "=========================================="

          terraform init \
            -input=false

      # ==========================================================
      # Terraform Plan
      # ==========================================================

      - name: Terraform Plan - DEV
        working-directory: environments/dev
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "TERRAFORM PLAN - DEV"
          echo "=========================================="

          terraform plan \
            -input=false \
            -out=tfplan

      # ==========================================================
      # Generate Human-Readable Plan
      # ==========================================================

      - name: Generate plan summary
        working-directory: environments/dev
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "TERRAFORM PLAN SUMMARY"
          echo "=========================================="

          terraform show \
            -no-color \
            tfplan | tee tfplan.txt

      # ==========================================================
      # Upload Binary Plan
      # ==========================================================

      - name: Upload Terraform binary plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-dev-plan
          path: environments/dev/tfplan
          if-no-files-found: error
          retention-days: 7

      # ==========================================================
      # Upload Human-Readable Plan
      # ==========================================================

      - name: Upload Terraform plan summary
        uses: actions/upload-artifact@v4
        with:
          name: terraform-dev-plan-summary
          path: environments/dev/tfplan.txt
          if-no-files-found: error
          retention-days: 7

      # ==========================================================
      # Job Summary
      # ==========================================================

      - name: Write job summary
        working-directory: environments/dev
        run: |
          set -euo pipefail

          {
            echo "## Terraform Plan - DEV"
            echo ""
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Terraform | ${{ env.TF_VERSION }} |"
            echo "| AWS Region | ${{ env.AWS_REGION }} |"
            echo "| Authentication | GitHub OIDC |"
            echo "| Environment | DEV |"
            echo ""
            echo "### Result"
            echo ""
            echo "Terraform plan completed successfully."
            echo ""
            echo "Artifacts:"
            echo "- \`terraform-dev-plan\` — binary Terraform plan"
            echo "- \`terraform-dev-plan-summary\` — human-readable plan"
          } >> "$GITHUB_STEP_SUMMARY"

      # ==========================================================
      # Final Summary
      # ==========================================================

      - name: Plan summary
        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo "TERRAFORM PLAN COMPLETED SUCCESSFULLY"
          echo "=========================================="
          echo ""
          echo "Environment       : DEV"
          echo "Terraform version : ${{ env.TF_VERSION }}"
          echo "AWS region        : ${{ env.AWS_REGION }}"
          echo "AWS authentication: GitHub OIDC"
          echo "Terraform init    : PASSED"
          echo "Terraform plan    : PASSED"
          echo "Plan artifact     : UPLOADED"
          echo "Plan summary      : UPLOADED"
